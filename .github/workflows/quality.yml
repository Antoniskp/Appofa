name: Quality

on:
  workflow_call:
    inputs:
      package_release:
        description: Package the tested frontend and matching source for production
        type: boolean
        default: false
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**', 'components/**', 'hooks/**', 'lib/**', 'messages/**', 'next.config.js', 'tailwind.config.js') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build frontend
        env:
          PACKAGE_RELEASE: ${{ inputs.package_release }}
          API_URL: ${{ inputs.package_release && vars.API_URL || '' }}
          SITE_URL: ${{ inputs.package_release && vars.SITE_URL || '' }}
          NEXT_PUBLIC_API_URL: ${{ inputs.package_release && vars.NEXT_PUBLIC_API_URL || '' }}
          NEXT_PUBLIC_APP_URL: ${{ inputs.package_release && vars.NEXT_PUBLIC_APP_URL || '' }}
          NEXT_PUBLIC_SITE_URL: ${{ inputs.package_release && vars.NEXT_PUBLIC_SITE_URL || '' }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ inputs.package_release && vars.NEXT_PUBLIC_GA_MEASUREMENT_ID || '' }}
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ inputs.package_release && vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY || '' }}
        run: |
          npm run frontend:build
          if [[ "$PACKAGE_RELEASE" == true ]]; then
            node > .next/appofa-release.json <<'NODE'
          const buildEnv = Object.fromEntries(Object.entries(process.env).filter(([name]) =>
            name.startsWith('NEXT_PUBLIC_') || name === 'API_URL' || name === 'SITE_URL'
          ));
          console.log(JSON.stringify({ nextVersion: require('next/package.json').version, buildEnv }));
          NODE
          fi

      - name: Package tested release
        if: inputs.package_release
        shell: bash
        run: |
          release_dir=$(mktemp -d)
          trap 'rm -rf -- "$release_dir"' EXIT
          git archive HEAD | tar -x -C "$release_dir"
          tar --exclude=.next/cache -czf "$RUNNER_TEMP/appofa-release.tar.gz" \
            -C "$release_dir" . -C "$GITHUB_WORKSPACE" .next

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install browser system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Browser journeys (desktop and mobile)
        run: npm run test:e2e

      - name: Upload tested release
        if: inputs.package_release
        uses: actions/upload-artifact@v4
        with:
          name: appofa-release
          path: ${{ runner.temp }}/appofa-release.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
